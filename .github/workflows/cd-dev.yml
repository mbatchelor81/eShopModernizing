name: CD — Dev

on:
  push:
    branches: [main]

concurrency:
  group: cd-dev
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  packages: write

env:
  REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}
  IMAGE_NAME: eshop/legacy-mvc
  ENVIRONMENT: dev

jobs:
  build-push:
    name: Build & Push Image
    runs-on: windows-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image metadata
        id: meta
        shell: bash
        run: |
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"
          echo "tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Docker Login
        run: echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ env.REGISTRY }} -u ${{ secrets.ACR_USERNAME }} --password-stdin

      - name: Build & Push
        run: |
          $tag = "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}"
          $latest = "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          docker build -t $tag -t $latest `
            -f eShopLegacyMVCSolution/src/eShopLegacyMVC/Dockerfile `
            eShopLegacyMVCSolution
          docker push $tag
          docker push $latest

  terraform:
    name: Terraform Apply (Dev)
    runs-on: ubuntu-latest
    needs: build-push
    environment: dev
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5"

      - name: Terraform Init
        run: terraform init
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

      - name: Terraform Apply
        run: terraform apply -auto-approve -var-file=environments/dev.tfvars
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

  deploy:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: [build-push, terraform]
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Helm Deploy
        uses: ./.github/actions/helm-deploy
        with:
          environment: dev
          image-repository: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          image-tag: ${{ needs.build-push.outputs.image-tag }}
          kubeconfig: ${{ secrets.KUBECONFIG_DEV }}
          health-url: ${{ secrets.HEALTH_URL_DEV }}

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [build-push, terraform, deploy]
    if: failure()
    steps:
      - name: Send Notification
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":x: *CD Dev Failed* — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>\nCommit: `${{ github.sha }}`\nAuthor: ${{ github.actor }}"
            }
