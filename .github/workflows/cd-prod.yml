name: CD - Production

on:
  release:
    types: [published]

concurrency:
  group: cd-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  ENVIRONMENT: prod
  REGISTRY: ${{ vars.ACR_LOGIN_SERVER }}
  IMAGE_NAME: eshop/legacymvc
  CHART_PATH: charts/eshop-legacy-mvc

jobs:
  build-push:
    name: Build & Push Image
    runs-on: windows-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        shell: bash
        run: echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"

      - name: Login to ACR
        uses: azure/docker-login@v2
        with:
          login-server: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }} `
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:stable `
            -f eShopLegacyMVCSolution/src/eShopLegacyMVC/Dockerfile `
            eShopLegacyMVCSolution/src/eShopLegacyMVC/
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:stable

  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: build-push
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5"

      - name: Terraform Init
        working-directory: infra
        run: terraform init -backend-config="environments/backend-${{ env.ENVIRONMENT }}.conf"

      - name: Terraform Apply
        working-directory: infra
        run: terraform apply -auto-approve -var-file="environments/${{ env.ENVIRONMENT }}.tfvars"

  deploy:
    name: Helm Deploy
    runs-on: ubuntu-latest
    needs: [build-push, terraform]
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        uses: azure/aks-set-context@v4
        with:
          resource-group: rg-eshop-${{ env.ENVIRONMENT }}
          cluster-name: aks-eshop-${{ env.ENVIRONMENT }}

      - name: Helm Deploy
        uses: ./.github/actions/helm-deploy
        with:
          release-name: eshop-mvc
          chart-path: ${{ env.CHART_PATH }}
          namespace: eshop-${{ env.ENVIRONMENT }}
          values-file: ${{ env.CHART_PATH }}/values-prod.yaml
          image-repository: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          image-tag: ${{ needs.build-push.outputs.image_tag }}

      - name: Smoke Test
        run: |
          ENDPOINT=$(kubectl get ingress -n eshop-${{ env.ENVIRONMENT }} eshop-mvc-eshop-legacy-mvc -o jsonpath='{.spec.rules[0].host}')
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${ENDPOINT}/health" || true)
            if [ "$STATUS" = "200" ]; then
              echo "Smoke test passed"
              exit 0
            fi
            echo "Attempt $i: status=$STATUS, retrying in 30s..."
            sleep 30
          done
          echo "Smoke test failed — rolling back"
          helm rollback eshop-mvc -n eshop-${{ env.ENVIRONMENT }}
          exit 1
