name: CD — Production

on:
  release:
    types: [published]

concurrency:
  group: cd-prod
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}
  IMAGE_NAME: eshop/legacy-mvc
  ENVIRONMENT: prod

jobs:
  build-push:
    name: Build & Push Release Image
    runs-on: windows-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image metadata
        id: meta
        shell: bash
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha-tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Docker Login
        run: echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ env.REGISTRY }} -u ${{ secrets.ACR_USERNAME }} --password-stdin

      - name: Build & Push
        run: |
          $semver = "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}"
          $sha = "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha-tag }}"
          $latest = "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          docker build -t $semver -t $sha -t $latest `
            -f eShopLegacyMVCSolution/src/eShopLegacyMVC/Dockerfile `
            eShopLegacyMVCSolution
          docker push $semver
          docker push $sha
          docker push $latest

  terraform:
    name: Terraform Apply (Production)
    runs-on: ubuntu-latest
    needs: build-push
    environment: prod
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5"

      - name: Terraform Init
        run: terraform init
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

      - name: Terraform Apply
        run: terraform apply -auto-approve -var-file=environments/prod.tfvars
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-push, terraform]
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Helm Deploy
        uses: ./.github/actions/helm-deploy
        with:
          environment: prod
          image-repository: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          image-tag: ${{ needs.build-push.outputs.image-tag }}
          kubeconfig: ${{ secrets.KUBECONFIG_PROD }}
          health-url: ${{ secrets.HEALTH_URL_PROD }}

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [build-push, terraform, deploy]
    if: failure()
    steps:
      - name: Send Notification
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":x: *CD Production Failed* — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>\nRelease: `${{ github.event.release.tag_name }}`"
            }
