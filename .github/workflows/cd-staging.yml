name: CD — Staging

on:
  workflow_dispatch:
    inputs:
      image-tag:
        description: Image tag to deploy (Git SHA short)
        required: true
  push:
    tags: ["v*.*.*-rc*"]

concurrency:
  group: cd-staging
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}
  IMAGE_NAME: eshop/legacy-mvc
  ENVIRONMENT: staging

jobs:
  resolve-tag:
    name: Resolve Image Tag
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Determine tag
        id: tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.image-tag }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "value=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${COMMIT_SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

  terraform:
    name: Terraform Apply (Staging)
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5"

      - name: Terraform Init
        run: terraform init
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

      - name: Terraform Apply
        run: terraform apply -auto-approve -var-file=environments/staging.tfvars
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [resolve-tag, terraform]
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Helm Deploy
        uses: ./.github/actions/helm-deploy
        with:
          environment: staging
          image-repository: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          image-tag: ${{ needs.resolve-tag.outputs.image-tag }}
          kubeconfig: ${{ secrets.KUBECONFIG_STAGING }}
          health-url: ${{ secrets.HEALTH_URL_STAGING }}

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [resolve-tag, terraform, deploy]
    if: failure()
    steps:
      - name: Send Notification
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":x: *CD Staging Failed* — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>\nTag: `${{ needs.resolve-tag.outputs.image-tag }}`"
            }
