name: .NET 8 Modernized CI

on:
  push:
    branches:
      - main
      - "devin/**"
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/eshop

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/eShopModernized

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    strategy:
      matrix:
        include:
          - service: catalog-api
            dockerfile: Dockerfile.api
          - service: catalog-web
            dockerfile: Dockerfile.web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (${{ matrix.service }})
        uses: docker/build-push-action@v5
        with:
          context: src/eShopModernized
          file: src/eShopModernized/${{ matrix.dockerfile }}
          push: false
          load: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-compose-integration:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Build and start services
        working-directory: src/eShopModernized
        run: docker compose up -d --build --wait

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for SQL Server health check..."
          for i in $(seq 1 30); do
            if docker compose -f src/eShopModernized/docker-compose.yml ps sqlserver | grep -q "healthy"; then
              echo "SQL Server is healthy"
              break
            fi
            echo "Attempt $i/30 — waiting..."
            sleep 5
          done

          echo "Waiting for Catalog API..."
          for i in $(seq 1 20); do
            if curl -sf http://localhost:5000/health > /dev/null 2>&1; then
              echo "Catalog API is healthy"
              break
            fi
            echo "Attempt $i/20 — waiting..."
            sleep 5
          done

          echo "Waiting for Catalog Web..."
          for i in $(seq 1 20); do
            if curl -sf http://localhost:5002/health > /dev/null 2>&1; then
              echo "Catalog Web is healthy"
              break
            fi
            echo "Attempt $i/20 — waiting..."
            sleep 5
          done

      - name: Smoke test — API endpoints
        run: |
          echo "=== Health Check ==="
          curl -f http://localhost:5000/health

          echo ""
          echo "=== Swagger ==="
          curl -sf http://localhost:5000/swagger/v1/swagger.json | head -c 200

          echo ""
          echo "=== Catalog Items ==="
          curl -sf http://localhost:5000/api/catalog/items?pageSize=5 | head -c 500

          echo ""
          echo "=== Catalog Brands ==="
          curl -sf http://localhost:5000/api/catalog/brands | head -c 500

          echo ""
          echo "=== Catalog Types ==="
          curl -sf http://localhost:5000/api/catalog/types | head -c 500

          echo ""
          echo "=== Web UI Health ==="
          curl -f http://localhost:5002/health

      - name: Tear down
        if: always()
        working-directory: src/eShopModernized
        run: docker compose down -v

  docker-push:
    runs-on: ubuntu-latest
    needs: [docker-build, docker-compose-integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: catalog-api
            dockerfile: Dockerfile.api
          - service: catalog-web
            dockerfile: Dockerfile.web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ matrix.service }})
        uses: docker/build-push-action@v5
        with:
          context: src/eShopModernized
          file: src/eShopModernized/${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
