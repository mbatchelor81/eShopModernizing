# ============================================================================
# Kubernetes Secret for eShop Database Credentials
# ============================================================================
# Create this secret before deploying any eShop services:
#
#   kubectl create secret generic eshop-db-secrets \
#     --from-literal=sa-password='<YourStrongPassword>'
#
# Or apply this manifest after base64-encoding your password:
#
#   echo -n '<YourStrongPassword>' | base64
#
# Then replace the value below and run:
#
#   kubectl apply -f eshop-db-secrets.yml
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: eshop-db-secrets
type: Opaque
data:
  sa-password: <base64-encoded-password>
