replicaCount: 2

resources:
  requests:
    cpu: 500m
    memory: 768Mi
  limits:
    cpu: "2"
    memory: 2Gi

ingress:
  host: eshop-staging.example.com

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilization: 75

podDisruptionBudget:
  enabled: true
  minAvailable: 1
