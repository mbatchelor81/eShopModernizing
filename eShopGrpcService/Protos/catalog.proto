syntax = "proto3";

option csharp_namespace = "eShopGrpcService";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

package catalog;

// Entity messages
message CatalogItemMsg {
  int32 id = 1;
  string description = 2;
  string name = 3;
  string price = 4; // decimal as string for precision
  string picturefilename = 5;
  int32 catalog_brand_id = 6;
  int32 catalog_type_id = 7;
  CatalogTypeMsg catalog_type = 8;
  CatalogBrandMsg catalog_brand = 9;
}

message CatalogBrandMsg {
  int32 id = 1;
  string brand = 2;
}

message CatalogTypeMsg {
  int32 id = 1;
  string type = 2;
}

message CatalogItemsStockMsg {
  int32 stock_id = 1;
  google.protobuf.Timestamp date = 2;
  int32 catalog_item_id = 3;
  int32 available_stock = 4;
}

message DiscountItemMsg {
  int32 id = 1;
  double size = 2;
  google.protobuf.Timestamp start = 3;
  google.protobuf.Timestamp end = 4;
}

// Request/Response messages
message FindCatalogItemRequest {
  int32 id = 1;
}

message GetCatalogItemsRequest {
  int32 brand_id_filter = 1;
  int32 type_id_filter = 2;
}

message GetAvailableStockRequest {
  google.protobuf.Timestamp date = 1;
  int32 catalog_item_id = 2;
}

message GetAvailableStockResponse {
  int32 available_stock = 1;
}

message CreateAvailableStockRequest {
  CatalogItemsStockMsg catalog_items_stock = 1;
}

message CreateCatalogItemRequest {
  CatalogItemMsg catalog_item = 1;
}

message UpdateCatalogItemRequest {
  CatalogItemMsg catalog_item = 1;
}

message RemoveCatalogItemRequest {
  CatalogItemMsg catalog_item = 1;
}

message GetDiscountRequest {
  google.protobuf.Timestamp day = 1;
}

message CatalogItemListResponse {
  repeated CatalogItemMsg items = 1;
}

message CatalogBrandListResponse {
  repeated CatalogBrandMsg brands = 1;
}

message CatalogTypeListResponse {
  repeated CatalogTypeMsg types = 1;
}

// Service definition - maps 1:1 to the 10 WCF operations
service CatalogService {
  rpc FindCatalogItem (FindCatalogItemRequest) returns (CatalogItemMsg);
  rpc GetCatalogBrands (google.protobuf.Empty) returns (CatalogBrandListResponse);
  rpc GetCatalogItems (GetCatalogItemsRequest) returns (CatalogItemListResponse);
  rpc GetCatalogTypes (google.protobuf.Empty) returns (CatalogTypeListResponse);
  rpc GetAvailableStock (GetAvailableStockRequest) returns (GetAvailableStockResponse);
  rpc CreateAvailableStock (CreateAvailableStockRequest) returns (google.protobuf.Empty);
  rpc CreateCatalogItem (CreateCatalogItemRequest) returns (google.protobuf.Empty);
  rpc UpdateCatalogItem (UpdateCatalogItemRequest) returns (google.protobuf.Empty);
  rpc RemoveCatalogItem (RemoveCatalogItemRequest) returns (google.protobuf.Empty);
  rpc GetDiscount (GetDiscountRequest) returns (DiscountItemMsg);
}
