version: '3'

services:
  eshopwcfservice:
    environment:
      - ConnectionString=Server=sql.data;Database=eShopDatabase;User Id=sa;Password=${SA_PASSWORD}
    ports:
     - "5113:80"
  sql.data:
    environment:
      - SA_PASSWORD=${SA_PASSWORD}
      - ACCEPT_EULA=Y
    ports:
      - "5433:1433"
    healthcheck:
      test: [ "CMD", "sqlcmd", "-U", "sa", "-P", "${SA_PASSWORD}", "-Q", "select 1" ]
      interval: 1s
networks:
  default:
    external:
      name: nat
