<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Delete - eShop')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mt-4">
    <h2>Delete Confirmation</h2>

    <div class="alert alert-warning">
        <p>Are you sure you want to delete this item?</p>
    </div>

    <div class="card" style="max-width: 500px;">
        <div class="card-body">
            <h5 class="card-title" th:text="${item.name}"></h5>
            <dl class="row">
                <dt class="col-sm-5">Brand</dt>
                <dd class="col-sm-7" th:text="${item.catalogBrand?.brand}"></dd>
                <dt class="col-sm-5">Type</dt>
                <dd class="col-sm-7" th:text="${item.catalogType?.type}"></dd>
                <dt class="col-sm-5">Price</dt>
                <dd class="col-sm-7" th:text="${#numbers.formatDecimal(item.price, 1, 2)}"></dd>
                <dt class="col-sm-5">Stock</dt>
                <dd class="col-sm-7" th:text="${item.availableStock}"></dd>
            </dl>
        </div>
    </div>

    <form th:action="@{/catalog/{id}/delete(id=${item.id})}" method="post" class="mt-3">
        <button type="submit" class="btn btn-danger">Delete</button>
        <a th:href="@{/catalog}" class="btn btn-secondary">Cancel</a>
    </form>
</div>

<footer th:replace="~{fragments/layout :: scripts}"></footer>
</body>
</html>
