<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Details - eShop')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mt-4">
    <h2>Details</h2>

    <div class="card" style="max-width: 600px;">
        <div class="row no-gutters">
            <div class="col-md-4">
                <img th:src="@{/items/{id}/pic(id=${item.id})}" class="card-img" alt="Product image"/>
            </div>
            <div class="col-md-8">
                <div class="card-body">
                    <h5 class="card-title" th:text="${item.name}"></h5>
                    <p class="card-text" th:text="${item.description}"></p>
                    <dl class="row">
                        <dt class="col-sm-5">Price</dt>
                        <dd class="col-sm-7" th:text="${#numbers.formatDecimal(item.price, 1, 2)}"></dd>
                        <dt class="col-sm-5">Brand</dt>
                        <dd class="col-sm-7" th:text="${item.catalogBrand?.brand}"></dd>
                        <dt class="col-sm-5">Type</dt>
                        <dd class="col-sm-7" th:text="${item.catalogType?.type}"></dd>
                        <dt class="col-sm-5">Stock</dt>
                        <dd class="col-sm-7" th:text="${item.availableStock}"></dd>
                        <dt class="col-sm-5">Restock Threshold</dt>
                        <dd class="col-sm-7" th:text="${item.restockThreshold}"></dd>
                        <dt class="col-sm-5">Max Stock</dt>
                        <dd class="col-sm-7" th:text="${item.maxStockThreshold}"></dd>
                        <dt class="col-sm-5">On Reorder</dt>
                        <dd class="col-sm-7" th:text="${item.onReorder}"></dd>
                        <dt class="col-sm-5">Picture File</dt>
                        <dd class="col-sm-7" th:text="${item.pictureFileName}"></dd>
                    </dl>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-3">
        <a th:href="@{/catalog/{id}/edit(id=${item.id})}" class="btn btn-warning">Edit</a>
        <a th:href="@{/catalog}" class="btn btn-secondary">Back to List</a>
    </div>
</div>

<footer th:replace="~{fragments/layout :: scripts}"></footer>
</body>
</html>
