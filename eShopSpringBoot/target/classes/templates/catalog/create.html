<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Create - eShop')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mt-4">
    <h2>Create</h2>

    <form th:action="@{/catalog/create}" th:object="${catalogItem}" method="post" class="col-md-8">
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" class="form-control" id="name" th:field="*{name}" required/>
            <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>
        <div class="form-group">
            <label for="description">Description</label>
            <textarea class="form-control" id="description" th:field="*{description}" rows="3"></textarea>
        </div>
        <div class="form-group">
            <label for="price">Price</label>
            <input type="number" step="0.01" class="form-control" id="price" th:field="*{price}" min="0" max="1000000"/>
            <div class="text-danger" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
        </div>
        <div class="form-group">
            <label for="pictureFileName">Picture File Name</label>
            <input type="text" class="form-control" id="pictureFileName" th:field="*{pictureFileName}"/>
        </div>
        <div class="form-group">
            <label for="catalogTypeId">Type</label>
            <select class="form-control" id="catalogTypeId" th:field="*{catalogTypeId}">
                <option th:each="type : ${types}" th:value="${type.id}" th:text="${type.type}"></option>
            </select>
        </div>
        <div class="form-group">
            <label for="catalogBrandId">Brand</label>
            <select class="form-control" id="catalogBrandId" th:field="*{catalogBrandId}">
                <option th:each="brand : ${brands}" th:value="${brand.id}" th:text="${brand.brand}"></option>
            </select>
        </div>
        <div class="form-group">
            <label for="availableStock">Stock</label>
            <input type="number" class="form-control" id="availableStock" th:field="*{availableStock}" min="0" max="10000000"/>
            <div class="text-danger" th:if="${#fields.hasErrors('availableStock')}" th:errors="*{availableStock}"></div>
        </div>
        <div class="form-group">
            <label for="restockThreshold">Restock Threshold</label>
            <input type="number" class="form-control" id="restockThreshold" th:field="*{restockThreshold}" min="0"/>
        </div>
        <div class="form-group">
            <label for="maxStockThreshold">Max Stock Threshold</label>
            <input type="number" class="form-control" id="maxStockThreshold" th:field="*{maxStockThreshold}" min="0"/>
        </div>
        <div class="form-check mb-3">
            <input type="checkbox" class="form-check-input" id="onReorder" th:field="*{onReorder}"/>
            <label class="form-check-label" for="onReorder">On Reorder</label>
        </div>
        <button type="submit" class="btn btn-primary">Create</button>
        <a th:href="@{/catalog}" class="btn btn-secondary">Cancel</a>
    </form>
</div>

<footer th:replace="~{fragments/layout :: scripts}"></footer>
</body>
</html>
