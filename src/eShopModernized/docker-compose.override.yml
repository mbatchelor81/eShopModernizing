# Development overrides — applied automatically by `docker compose up`
services:
  catalog-api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Logging__LogLevel__Default=Debug
      - Logging__LogLevel__Microsoft.AspNetCore=Information
      - UseMockData=false
    volumes:
      - ./eShop.Catalog.Api/appsettings.Development.json:/app/appsettings.Development.json:ro

  catalog-web:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Logging__LogLevel__Default=Debug
      - Logging__LogLevel__Microsoft.AspNetCore=Information
    volumes:
      - ./eShop.Catalog.Web/appsettings.Development.json:/app/appsettings.Development.json:ro

  sqlserver:
    ports:
      - "1433:1433"
