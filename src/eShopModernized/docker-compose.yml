services:
  catalog-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "5000:8080"  # REST
      - "5001:8081"  # gRPC
    environment:
      - ConnectionStrings__CatalogDb=Server=sqlserver;Database=CatalogDb;User Id=sa;Password=Your_password123;TrustServerCertificate=true
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      sqlserver:
        condition: service_healthy

  catalog-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "5002:8080"
    environment:
      - CatalogApi__BaseUrl=http://catalog-api:8080
      - CatalogApiBaseUrl=http://catalog-api:8080
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - catalog-api

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Your_password123
    ports:
      - "1433:1433"
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Your_password123 -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - sqlserver-data:/var/opt/mssql

volumes:
  sqlserver-data:
